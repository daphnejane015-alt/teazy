[build]
builder = "nixpacks"

[build.nixpacksPlan.phases.setup]
nixPkgs = [
    "php81",
    "php81Extensions.pdo_mysql",
    "php81Extensions.mbstring",
    "php81Extensions.tokenizer",
    "php81Extensions.xml",
    "php81Extensions.dom",
    "php81Extensions.ctype",
    "php81Extensions.json",
    "php81Extensions.bcmath",
    "php81Extensions.curl",
    "php81Extensions.fileinfo",
    "php81Extensions.openssl",
    "composer",
    "nodejs"
]

[build.nixpacksPlan.phases.install]
cmds = [
    "npm install",
    "composer install --no-dev --optimize-autoloader"
]

[build.nixpacksPlan.phases.build]
cmds = [
    "npm run build"
]

[deploy]
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"
preDeployCommand = "php artisan migrate --force && php artisan config:cache && php artisan view:cache"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[deploy.workers.scheduler]
startCommand = "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
restartPolicyType = "always"
